<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparador · Clínica Alvarez</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bd:#0278fb;--bm:#418cdf;--bl:#7cb9f0;--bp:#deeeff;--gd:#2d2d2d;--gm:#6b7280;--w:#fff;--bg:#f0f5fb;--ln:#c5d9f0}
body{background:var(--bg);color:var(--gd);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 0 60px}

/* HEADER */
.hdr{width:100%;background:var(--w);border-bottom:1px solid var(--ln);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 16px rgba(2,120,251,.06)}
.hdr svg{height:36px;width:auto}
.pill{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--bd);background:var(--bp);border:1px solid var(--bl);padding:5px 14px;border-radius:100px;font-weight:500}

/* HERO */
.hero{text-align:center;padding:44px 24px 28px;position:relative}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 0%,rgba(2,120,251,.07) 0%,transparent 70%);pointer-events:none}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--bm);font-weight:500;margin-bottom:12px}
.eyebrow::before,.eyebrow::after{content:'';width:24px;height:1px;background:var(--bl)}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.2rem,5vw,3.8rem);font-weight:300;line-height:1.05;margin-bottom:10px}
h1 em{font-style:italic;background:linear-gradient(90deg,var(--bm),var(--bd));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.pname{font-size:13px;color:var(--gm);letter-spacing:.06em;font-weight:400;margin-bottom:4px}
.ptratamiento{font-size:11px;color:var(--bl);letter-spacing:.1em;text-transform:uppercase;font-weight:400}

/* SLIDER */
.wrap{width:100%;max-width:960px;padding:0 20px}
.sc{position:relative;width:100%;border-radius:16px;overflow:hidden;cursor:col-resize;user-select:none;box-shadow:0 12px 48px rgba(2,120,251,.18),0 2px 8px rgba(0,0,0,.08)}
.ia{display:block;width:100%;height:auto;max-height:75vh;object-fit:cover}
.bw{position:absolute;inset:0;overflow:hidden;width:50%}
.ib{display:block;width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.div{position:absolute;top:0;bottom:0;left:50%;width:3px;background:linear-gradient(180deg,rgba(255,255,255,.4) 0%,#fff 40%,#fff 60%,rgba(255,255,255,.4) 100%);box-shadow:0 0 0 1px rgba(2,120,251,.3),0 0 20px rgba(2,120,251,.2);pointer-events:none;transform:translateX(-50%)}
.hdl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 20px rgba(2,120,251,.25),0 0 0 3px rgba(2,120,251,.15);pointer-events:none}
.hdl svg{width:20px;height:20px}
.lbl{position:absolute;top:14px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;padding:5px 12px;border-radius:100px;pointer-events:none;backdrop-filter:blur(8px)}
.lb{left:14px;background:rgba(255,255,255,.85);color:var(--bm);border:1px solid rgba(2,120,251,.2)}
.la{right:14px;background:rgba(2,120,251,.85);color:#fff}
.cr{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px;flex-wrap:wrap}
.hint{font-size:11px;color:var(--gm);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.hint svg{width:14px;height:14px;stroke:var(--bl);fill:none;stroke-width:1.5}

/* ERROR */
.error{text-align:center;padding:60px 24px;color:var(--gm);font-size:13px}

footer{margin-top:60px;font-size:11px;color:var(--bl);letter-spacing:.12em;text-transform:uppercase;text-align:center}

@media(max-width:640px){
  .hdr{padding:14px 20px}
  .hdr svg{height:28px}
}
</style>
</head>

<footer>© Clínica Alvarez · Resultado de tratamiento</footer>

<script>
// Leer parámetros de la URL
var params = new URLSearchParams(window.location.search);
var urlAntes    = params.get('antes');
var urlDespues  = params.get('despues');
var paciente    = params.get('paciente');
var tratamiento = params.get('tratamiento');

// Título dinámico
if(paciente) document.title = 'Comparador · Clínica Alvarez · ' + paciente;

// Badge paciente/tratamiento
if(paciente){
  var elP = document.getElementById('heroPaciente');
  elP.textContent = paciente;
  elP.style.display = 'block';
}
if(tratamiento){
  var elT = document.getElementById('heroTratamiento');
  elT.textContent = tratamiento;
  elT.style.display = 'block';
}

// Slider
var dragging = false;
var sc = document.getElementById('sc');

function setPos(p){
  p = Math.max(.01, Math.min(.99, p));
  document.getElementById('bw').style.width = (p*100) + '%';
  document.getElementById('dv').style.left  = (p*100) + '%';
}
function fixW(){
  var w  = sc.offsetWidth;
  var ib = document.getElementById('imgBefore');
  ib.style.width    = w + 'px';
  ib.style.minWidth = w + 'px';
}
function getPct(x){
  var r = sc.getBoundingClientRect();
  return (x - r.left) / r.width;
}

// Cargar imágenes
if(urlAntes && urlDespues){
  var imgA = document.getElementById('imgAfter');
  var imgB = document.getElementById('imgBefore');
  var loaded = 0;

  function onLoad(){
    loaded++;
    if(loaded === 2){
      document.getElementById('sliderWrap').style.display = '';
      setPos(.5);
      fixW();
    }
  }
  function onError(){
    document.getElementById('errorMsg').style.display = '';
  }

  imgA.onload  = onLoad;
  imgA.onerror = onError;
  imgB.onload  = onLoad;
  imgB.onerror = onError;

  imgA.src = urlDespues;
  imgB.src = urlAntes;

  window.addEventListener('resize', fixW);

  // Mouse
  sc.addEventListener('mousedown', function(e){ dragging=true; setPos(getPct(e.clientX)); });
  window.addEventListener('mousemove', function(e){ if(dragging) setPos(getPct(e.clientX)); });
  window.addEventListener('mouseup', function(){ dragging=false; });

  // Touch
  sc.addEventListener('touchstart', function(e){ dragging=true; setPos(getPct(e.touches[0].clientX)); }, {passive:true});
  window.addEventListener('touchmove', function(e){ if(dragging) setPos(getPct(e.touches[0].clientX)); }, {passive:true});
  window.addEventListener('touchend', function(){ dragging=false; });

} else {
  document.getElementById('errorMsg').style.display = '';
}
</script>
</body>
</html>
